name: Judge
on:
  workflow_dispatch:
    inputs:
      judge_id:
        description: 'Judge ID'
        required: true
 
jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
 
      - name: Get judge data
        run: |
          git fetch origin judge-data
          git checkout origin/judge-data -- judge-data/ || true
 
      - name: Install pyyaml
        run: pip install pyyaml -q
 
      - name: Judge
        env:
          JUDGE_ID: ${{ github.event.inputs.judge_id }}
          PAYLOAD_FILE: judge-data/${{ github.event.inputs.judge_id }}-payload.json
          TESTDATA_FILE: judge-data/${{ github.event.inputs.judge_id }}-testdata.zip
        run: python3 judge.py 2>&1 || true
 
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.event.inputs.judge_id }}
          path: result.json
          retention-days: 1
